<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolos Manager - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        function checkAuth() {
            if (localStorage.getItem('token')) {
                window.location.href = '/rooms';
            }
        }
        checkAuth();
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 min-h-screen flex items-center justify-center p-4">
    
    <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-md w-full max-w-md" x-data="{
        username: '',
        password: '',
        error: '',
        loading: false,
        async submit() {
            this.loading = true;
            this.error = '';
            
            const formData = new URLSearchParams();
            formData.append('username', this.username);
            formData.append('password', this.password);

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });
                if (!res.ok) throw new Error('Credenciales incorrectas');
                const data = await res.json();
                localStorage.setItem('token', data.access_token);
                window.location.href = '/rooms';
            } catch(e) {
                this.error = e.message;
            } finally {
                this.loading = false;
            }
        }
    }">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">🎳 Bolos Manager</h1>
            <p class="text-gray-500">Inicia sesión para continuar</p>
        </div>

        <form @submit.prevent="submit" class="space-y-4">
            <div x-show="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded text-sm" x-text="error"></div>
            
            <div>
                <label class="block text-sm font-medium mb-1">Correo Electrónico</label>
                <input x-model="username" type="email" required class="w-full p-3 rounded bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-1">Contraseña</label>
                <input x-model="password" type="password" required class="w-full p-3 rounded bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none">
                <div class="mt-2 text-right text-sm">
                    <a href="/forgot-password" class="text-blue-500 hover:underline">¿Has olvidado tu contraseña?</a>
                </div>
            </div>
            
            <button type="submit" :disabled="loading" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition">
                <span x-show="!loading">Entrar</span>
                <span x-show="loading">Cargando...</span>
            </button>
        </form>

        <p class="mt-4 text-center text-sm">
            ¿No tienes cuenta? <a href="/register" class="text-blue-500 hover:underline">Regístrate</a>
        </p>
    </div>

</body>
</html>
