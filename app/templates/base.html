<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolos Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // Force dark mode basically
            theme: {
                extend: {
                    colors: {
                        primary: '#8b5cf6', // purple-500
                        primaryHover: '#7c3aed', // purple-600
                        surface: '#1c1e26',
                        background: '#0b0c10',
                        success: '#22c55e',
                    }
                }
            }
        }
        
        function getAuthToken() {
            return localStorage.getItem('token');
        }

        function checkAuth(requireAuth = true) {
            const token = getAuthToken();
            if (requireAuth && !token) {
                window.location.href = '/';
            } else if (!requireAuth && token) {
                window.location.href = '/rooms';
            }
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/';
        }
    </script>
</head>
<body class="bg-background text-gray-100 min-h-screen pb-20 font-sans selection:bg-primary selection:text-white">
    
    <!-- Header (Optional top branding on mobile) -->
    <header class="p-4 flex justify-between items-center bg-background sticky top-0 z-40 bg-opacity-90 backdrop-blur-sm border-b border-gray-800">
        <a href="/rooms" class="text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-primary">🎳 BowlingClub</a>
        <button onclick="logout()" class="text-gray-400 hover:text-red-400 text-sm font-semibold px-3 py-1 bg-surface rounded-full border border-gray-800">Salir</button>
    </header>

    <main class="w-full max-w-lg mx-auto p-4 flex-col gap-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Bottom Navigation for Mobile-First -->
    <nav class="fixed bottom-0 w-full bg-surface border-t border-gray-800 pb-safe z-50">
        <div class="flex justify-around items-center max-w-lg mx-auto p-2">
            <a href="/rooms" class="flex flex-col items-center p-2 text-gray-400 hover:text-primary transition-colors focus:text-primary">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                <span class="text-[10px] font-semibold uppercase tracking-wider">Salas</span>
            </a>
            <a href="/profile" class="flex flex-col items-center p-2 text-gray-400 hover:text-primary transition-colors focus:text-primary">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[10px] font-semibold uppercase tracking-wider">Perfil</span>
            </a>
        </div>
    </nav>
    
    <script>
        // Force dark mode
        document.documentElement.classList.add('dark');
    </script>
</body>
</html>
