{% extends "base.html" %}
{% block content %}
<div x-data="gameForm({{ room_id }})" x-init="init()" class="space-y-6">
    <div class="flex items-center justify-between mb-4">
        <h2 class="text-2xl font-bold">Añadir Partida</h2>
        <a href="/rooms/{{ room_id }}" class="text-gray-500 hover:text-gray-700 font-semibold">Volver</a>
    </div>

    <!-- Seleccionar Jugador -->
    <div class="bg-white dark:bg-gray-800 shadow rounded-lg p-4 flex flex-col sm:flex-row gap-4 items-end">
        <div class="w-full">
            <label class="block text-sm font-medium mb-1">Seleccionar Jugador de la Sala</label>
            <select x-model="selectedUserId" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 outline-none">
                <option value="">-- Seleccionar --</option>
                <template x-for="member in availableMembers" :key="member.user.id">
                    <option :value="member.user.id" x-text="member.user.full_name"></option>
                </option>
                </template>
            </select>
        </div>
        <button @click="addPlayerRow" :disabled="!selectedUserId" class="w-full sm:w-auto px-6 py-2 bg-green-500 hover:bg-green-600 text-white font-bold rounded shadow disabled:opacity-50">
            Añadir
        </button>
    </div>

    <div x-show="errorMsg" class="bg-red-100 text-red-700 p-3 rounded" x-text="errorMsg"></div>

    <div class="space-y-6" x-show="gameScores.length > 0">
        <!-- Selector de Modo -->
        <div class="flex border-b border-gray-200 dark:border-gray-700">
            <button @click="inputMode = 'fast'" :class="inputMode === 'fast' ? 'border-primary text-primary' : 'border-transparent text-gray-500 hover:text-gray-700'" class="px-4 py-2 border-b-2 font-medium flex-1 sm:flex-none">Modo Rápido</button>
            <button @click="inputMode = 'detailed'" :class="inputMode === 'detailed' ? 'border-primary text-primary' : 'border-transparent text-gray-500 hover:text-gray-700'" class="px-4 py-2 border-b-2 font-medium flex-1 sm:flex-none">Modo Detallado</button>
        </div>

        <!-- Modo Rápido -->
        <div x-show="inputMode === 'fast'" class="bg-white dark:bg-gray-800 shadow rounded-lg overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-gray-100 dark:bg-gray-700">
                    <tr>
                        <th class="p-3 font-semibold min-w-[120px]">Jugador</th>
                        <th class="p-3 font-semibold w-24">Puntos</th>
                        <th class="p-3 font-semibold w-24">Plenos</th>
                        <th class="p-3 font-semibold w-24">Semipl.</th>
                        <th class="p-3 font-semibold min-w-[150px]">Mote (Opc.)</th>
                        <th class="p-3 font-semibold w-16"></th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="(player, pIndex) in gameScores" :key="player.user_id">
                        <tr class="border-t dark:border-gray-700">
                            <td class="p-3 font-medium" x-text="player.name"></td>
                            <td class="p-3">
                                <input type="number" x-model.number="player.score" min="0" max="300" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 outline-none" required>
                            </td>
                            <td class="p-3">
                                <input type="number" x-model.number="player.strikes" min="0" max="12" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 outline-none">
                            </td>
                            <td class="p-3">
                                <input type="number" x-model.number="player.spares" min="0" max="10" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 outline-none">
                            </td>
                            <td class="p-3">
                                <input type="text" x-model="player.nickname" placeholder="Ej. Torta" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 outline-none">
                            </td>
                            <td class="p-3 text-center">
                                <button @click="removePlayerRow(pIndex)" class="text-red-500 hover:text-red-700" title="Eliminar">
                                    <svg class="w-6 h-6 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- Modo Detallado -->
        <div x-show="inputMode === 'detailed'" class="space-y-6">
            <template x-for="(player, pIndex) in gameScores" :key="player.user_id">
                <div class="bg-white dark:bg-gray-800 shadow rounded-lg p-4 overflow-x-auto relative">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="font-bold text-lg" x-text="player.name"></h3>
                        <button @click="removePlayerRow(pIndex)" class="text-red-500 hover:text-red-700 text-sm">Eliminar</button>
                    </div>
                    <div class="mb-2">
                        <input type="text" x-model="player.nickname" placeholder="Mote opcional (ej. Torta)" class="w-full max-w-xs p-1 text-sm border rounded dark:bg-gray-700 dark:border-gray-600 outline-none">
                    </div>
                    
                    <table class="w-full min-w-[600px] text-center border-collapse border border-gray-300 dark:border-gray-600">
                        <thead>
                            <tr class="bg-gray-100 dark:bg-gray-700">
                                <template x-for="i in 10">
                                    <th class="border border-gray-300 dark:border-gray-600 p-1 text-sm" x-text="i"></th>
                                </template>
                                <th class="border border-gray-300 dark:border-gray-600 p-1 text-sm bg-gray-200 dark:bg-gray-600">Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <template x-for="(frame, fIndex) in player.frames">
                                    <td class="border border-gray-300 dark:border-gray-600 p-0 align-top relative w-1/11">
                                        <div class="flex border-b border-gray-300 dark:border-gray-600 h-8">
                                            <div class="flex-1 border-r border-gray-300 dark:border-gray-600">
                                                <input type="text" maxlength="1" @input="updateScore(pIndex)" x-model="frame.roll1" class="w-full h-full text-center bg-transparent outline-none uppercase font-semibold">
                                            </div>
                                            <div class="flex-1" :class="{'border-r border-gray-300 dark:border-gray-600': fIndex === 9}">
                                                <input type="text" maxlength="1" @input="updateScore(pIndex)" x-model="frame.roll2" class="w-full h-full text-center bg-transparent outline-none uppercase font-semibold" :disabled="fIndex !== 9 && frame.roll1 === 'X'">
                                            </div>
                                            <template x-if="fIndex === 9">
                                                <div class="flex-1">
                                                    <input type="text" maxlength="1" @input="updateScore(pIndex)" x-model="frame.roll3" class="w-full h-full text-center bg-transparent outline-none uppercase font-semibold" :disabled="!(frame.roll1 === 'X' || frame.roll2 === '/')">
                                                </div>
                                            </template>
                                        </div>
                                        <div class="h-8 flex items-center justify-center font-bold" x-text="frame.score !== null ? frame.score : ''"></div>
                                    </td>
                                </template>
                                <td class="border border-gray-300 dark:border-gray-600 p-2 align-middle font-black text-xl text-primary bg-gray-50 dark:bg-gray-900" x-text="player.finalScore"></td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="mt-2 text-sm text-gray-500">
                        Plenos automáticos: <span class="font-bold" x-text="player.detailedStrikes"></span> | Semiplenos automáticos: <span class="font-bold" x-text="player.detailedSpares"></span>
                    </div>
                </div>
            </template>
        </div>
        
        <div class="flex justify-end pt-4">
            <button @click="saveGame" :disabled="saving" class="bg-primary hover:bg-blue-600 text-white font-bold py-2 px-6 rounded shadow disabled:opacity-50 text-lg w-full sm:w-auto">
                <span x-show="!saving">Guardar Partida</span>
                <span x-show="saving">Guardando...</span>
            </button>
        </div>
    </div>
    
    <div x-show="gameScores.length === 0" class="text-center py-10 bg-white dark:bg-gray-800 rounded-lg border border-dashed border-gray-300 dark:border-gray-600 text-gray-500">
        Añade jugadores a la partida para registrar sus resultados.
    </div>
</div>

<script>
function gameForm(roomId) {
    return {
        roomId: roomId,
        inputMode: 'fast', // 'fast' or 'detailed'
        members: [],
        selectedUserId: '',
        gameScores: [], 
        saving: false,
        errorMsg: '',
        
        async init() {
            checkAuth();
            await this.loadMembers();
        },
        async loadMembers() {
            try {
                const res = await fetch(`/api/rooms/${this.roomId}/members`, {
                    headers: { 'Authorization': `Bearer ${getAuthToken()}` }
                });
                if (res.status === 401) logout();
                if (res.ok) {
                    this.members = await res.json();
                }
            } catch (e) {
                console.error(e);
            }
        },
        get availableMembers() {
            const usedIds = this.gameScores.map(g => g.user_id);
            return this.members.filter(m => !usedIds.includes(m.user.id));
        },
        addPlayerRow() {
            const member = this.members.find(m => m.user.id == this.selectedUserId);
            if (member) {
                let frames = [];
                for(let i=0; i<10; i++) {
                    frames.push({roll1: '', roll2: '', roll3: '', score: null});
                }
                this.gameScores.push({
                    user_id: member.user.id,
                    name: member.user.full_name,
                    nickname: '',
                    score: 0,
                    strikes: 0,
                    spares: 0,
                    frames: frames,
                    finalScore: 0,
                    detailedStrikes: 0,
                    detailedSpares: 0
                });
                this.selectedUserId = '';
            }
        },
        removePlayerRow(index) {
            this.gameScores.splice(index, 1);
        },
        parseRoll(val) {
            if (!val) return null;
            val = val.toString().toUpperCase();
            if (val === 'X') return 10;
            if (val === '-') return 0;
            if (val === '/') return 'spare';
            let num = parseInt(val);
            if (!isNaN(num) && num >= 0 && num <= 9) return num;
            return null; 
        },
        updateScore(playerIndex) {
            let player = this.gameScores[playerIndex];
            let runningTotal = 0;
            let strikes = 0;
            let spares = 0;
            
            let allRolls = [];
            for (let i = 0; i < 9; i++) {
                let f = player.frames[i];
                let r1 = this.parseRoll(f.roll1);
                if (r1 !== null) {
                    allRolls.push(r1);
                    if (r1 === 10) {
                        strikes++;
                        f.roll2 = ''; 
                    } else {
                        let r2 = this.parseRoll(f.roll2);
                        if (r2 !== null) {
                            allRolls.push(r2);
                            if (r2 === 'spare') spares++;
                        }
                    }
                }
            }
            let f10 = player.frames[9];
            let r10_1 = this.parseRoll(f10.roll1);
            let r10_2 = this.parseRoll(f10.roll2);
            let r10_3 = this.parseRoll(f10.roll3);
            if (r10_1 !== null) {
                allRolls.push(r10_1);
                if (r10_1 === 10) strikes++;
            }
            if (r10_2 !== null) {
                allRolls.push(r10_2);
                if (r10_2 === 10) strikes++;
                else if (r10_2 === 'spare') spares++;
            }
            if (r10_3 !== null) {
                allRolls.push(r10_3);
                if (r10_3 === 10) strikes++;
            }

            let rollIndex = 0;
            for (let i = 0; i < 9; i++) {
                let frame = player.frames[i];
                frame.score = null;
                
                let r1 = this.parseRoll(frame.roll1);
                if (r1 === null) continue; 
                
                if (r1 === 10) { 
                    if (rollIndex + 2 < allRolls.length) {
                        let next1 = allRolls[rollIndex + 1];
                        let next2 = allRolls[rollIndex + 2];
                        let bonus = 0;
                        if (next2 === 'spare') {
                            bonus = 10;
                        } else {
                            bonus = (next1 === 10 ? 10 : next1) + (next2 === 10 ? 10 : next2);
                        }
                        runningTotal += 10 + bonus;
                        frame.score = runningTotal;
                    }
                    rollIndex += 1;
                } else { 
                    let r2 = this.parseRoll(frame.roll2);
                    if (r2 === null) continue;
                    
                    if (r2 === 'spare') {
                        if (rollIndex + 2 < allRolls.length) {
                            let next1 = allRolls[rollIndex + 2];
                            runningTotal += 10 + (next1 === 10 ? 10 : next1);
                            frame.score = runningTotal;
                        }
                    } else {
                        runningTotal += r1 + r2;
                        frame.score = runningTotal;
                    }
                    rollIndex += 2;
                }
            }
            
            f10.score = null;
            if (r10_1 !== null && r10_2 !== null) {
                let val1 = (r10_1 === 10) ? 10 : r10_1;
                let val2 = (r10_2 === 10) ? 10 : (r10_2 === 'spare' ? (10 - val1) : r10_2);
                
                if (r10_1 === 10 || r10_2 === 'spare') {
                    if (r10_3 !== null) {
                        let val3 = (r10_3 === 10) ? 10 : (r10_3 === 'spare' ? (10 - val2) : r10_3);
                        runningTotal += val1 + val2 + val3;
                        f10.score = runningTotal;
                    }
                } else {
                    runningTotal += val1 + val2;
                    f10.score = runningTotal;
                }
            }
            
            player.finalScore = runningTotal;
            player.detailedStrikes = strikes;
            player.detailedSpares = spares;
        },
        async saveGame() {
            this.errorMsg = '';
            
            if (this.gameScores.length === 0) return;

            this.saving = true;
            
            const payload = {
                scores: this.gameScores.map(player => {
                    if (this.inputMode === 'fast') {
                        return {
                            user_id: player.user_id,
                            score: parseInt(player.score) || 0,
                            strikes: parseInt(player.strikes) || 0,
                            spares: parseInt(player.spares) || 0,
                            nickname: player.nickname.trim() || null,
                            frames_data: null
                        };
                    } else {
                        return {
                            user_id: player.user_id,
                            score: player.finalScore || 0,
                            strikes: player.detailedStrikes || 0,
                            spares: player.detailedSpares || 0,
                            nickname: player.nickname.trim() || null,
                            frames_data: player.frames.map(f => ({
                                roll1: f.roll1 ? f.roll1.toUpperCase() : '',
                                roll2: f.roll2 ? f.roll2.toUpperCase() : '',
                                roll3: f.roll3 ? f.roll3.toUpperCase() : '',
                                score: f.score
                            }))
                        };
                    }
                })
            };

            // Validation
            for (let sc of payload.scores) {
                if (sc.score < 0 || sc.score > 300) {
                    this.errorMsg = `Error: La puntuación debe estar entre 0 y 300.`;
                    this.saving = false;
                    return;
                }
            }

            try {
                const res = await fetch(`/api/rooms/${this.roomId}/games`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getAuthToken()}`
                    },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    window.location.href = `/rooms/${this.roomId}`;
                } else {
                    const data = await res.json();
                    this.errorMsg = data.detail || 'Error al guardar la partida';
                }
            } catch (e) {
                this.errorMsg = 'Error de conexión';
            } finally {
                this.saving = false;
            }
        }
    }
}
</script>
{% endblock %}
