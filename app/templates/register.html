<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolos Manager - Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 min-h-screen flex items-center justify-center p-4">
    
    <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-md w-full max-w-md" x-data="{
        form: {
            email: '',
            username: '',
            password: '',
            full_name: '',
            phone_number: ''
        },
        error: '',
        loading: false,
        async submit() {
            this.loading = true;
            this.error = '';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.form)
                });
                
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Error al registrar');
                
                // Auto login or redirect
                alert('Registro exitoso. Ahora puedes iniciar sesión.');
                window.location.href = '/';
            } catch(e) {
                this.error = e.message;
            } finally {
                this.loading = false;
            }
        }
    }">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">Registro</h1>
            <p class="text-gray-500">Crea una cuenta nueva</p>
        </div>

        <form @submit.prevent="submit" class="space-y-4">
            <div x-show="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded text-sm" x-text="error"></div>
            
            <div>
                <label class="block text-sm font-medium mb-1">Nombre Completo</label>
                <input x-model="form.full_name" type="text" required class="w-full p-3 rounded bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Correo Electrónico</label>
                <input x-model="form.email" type="email" required class="w-full p-3 rounded bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-1">Teléfono (opcional)</label>
                <input x-model="form.phone_number" type="text" class="w-full p-3 rounded bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-1">Usuario</label>
                <input x-model="form.username" type="text" required class="w-full p-3 rounded bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-1">Contraseña</label>
                <input x-model="form.password" type="password" required minlength="6" class="w-full p-3 rounded bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <button type="submit" :disabled="loading" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition">
                <span x-show="!loading">Registrar</span>
                <span x-show="loading">Cargando...</span>
            </button>
        </form>

        <p class="mt-4 text-center text-sm">
            ¿Ya tienes cuenta? <a href="/" class="text-blue-500 hover:underline">Inicia sesión</a>
        </p>
    </div>

</body>
</html>
