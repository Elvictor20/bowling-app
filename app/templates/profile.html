{% extends "base.html" %}
{% block content %}
<div x-data="profileData()" x-init="init()" class="space-y-6">
    <div x-show="loading" class="text-center py-10 text-gray-400 font-medium animate-pulse">Cargando perfil...</div>
    
    <div x-show="!loading && user" class="bg-surface rounded-3xl border border-gray-800 shadow-xl overflow-hidden" x-cloak>
        <!-- Header Profile -->
        <div class="bg-gradient-to-br from-purple-600/30 to-surface p-8 text-center border-b border-gray-800">
            <div class="w-24 h-24 rounded-full bg-purple-600 mx-auto mb-4 flex items-center justify-center text-4xl font-bold text-white shadow-lg shadow-purple-900/50">
                <span x-text="user?.full_name ? user.full_name.charAt(0).toUpperCase() : ''"></span>
            </div>
            <h2 class="text-2xl font-black text-gray-100" x-text="user?.full_name"></h2>
            <p class="text-primary font-medium mt-1">@<span x-text="user?.username"></span></p>
        </div>

        <div class="p-6">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                <div class="bg-blue-900/20 border border-blue-500/20 p-5 rounded-2xl text-center">
                    <div class="text-xs uppercase tracking-wider font-bold text-blue-500 mb-2">Puntos Totales</div>
                    <div class="text-3xl font-black text-gray-100" x-text="user?.total_score"></div>
                </div>
                <div class="bg-green-900/20 border border-green-500/20 p-5 rounded-2xl text-center">
                    <div class="text-xs uppercase tracking-wider font-bold text-green-500 mb-2">Plenos (Strikes)</div>
                    <div class="text-3xl font-black text-gray-100" x-text="user?.total_strikes"></div>
                </div>
                <div class="bg-yellow-900/20 border border-yellow-500/20 p-5 rounded-2xl text-center">
                    <div class="text-xs uppercase tracking-wider font-bold text-yellow-500 mb-2">Semiplenos (Spares)</div>
                    <div class="text-3xl font-black text-gray-100" x-text="user?.total_spares"></div>
                </div>
            </div>

            <div>
                <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-4">Mis Motes</h3>
                <div class="flex flex-wrap gap-2" x-show="user?.nicknames?.length > 0">
                    <template x-for="nick in user?.nicknames">
                        <span class="px-4 py-1.5 bg-gray-800 border border-gray-700 rounded-full text-sm font-medium text-gray-200" x-text="nick"></span>
                    </template>
                </div>
                <div x-show="!user?.nicknames?.length" class="p-4 rounded-xl border border-dashed border-gray-700 text-gray-500 italic text-center text-sm">
                    Aún no tienes motes. ¡Juega unas partidas!
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function profileData() {
    return {
        loading: true,
        user: null,
        async init() {
            checkAuth();
            try {
                const res = await fetch('/api/users/me', {
                    headers: { 'Authorization': `Bearer ${getAuthToken()}` }
                });
                if (!res.ok) {
                    if(res.status === 401) logout();
                    throw new Error('Error cargando perfil');
                }
                this.user = await res.json();
            } catch (e) {
                console.error(e);
            } finally {
                this.loading = false;
            }
        }
    }
}
</script>
{% endblock %}
