{% extends "base.html" %}
{% block content %}
<div x-data="profileData()" x-init="init()" class="space-y-6">
    <div x-show="loading" class="text-center py-10 text-gray-400 font-medium animate-pulse">Cargando perfil...</div>
    
    <div x-show="!loading && user" class="bg-surface rounded-3xl border border-gray-800 shadow-xl overflow-hidden" x-cloak>
        <!-- Header Profile -->
        <div class="bg-gradient-to-br from-purple-600/30 to-surface p-8 text-center border-b border-gray-800">
            <div class="w-24 h-24 rounded-full bg-purple-600 mx-auto mb-4 flex items-center justify-center text-4xl font-bold text-white shadow-lg shadow-purple-900/50">
                <span x-text="user?.full_name ? user.full_name.charAt(0).toUpperCase() : ''"></span>
            </div>
            <h2 class="text-2xl font-black text-gray-100" x-text="user?.full_name"></h2>
            <p class="text-primary font-medium mt-1">@<span x-text="user?.username"></span></p>
        </div>

        <div class="p-6">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                <div class="bg-blue-900/20 border border-blue-500/20 p-5 rounded-2xl text-center">
                    <div class="text-xs uppercase tracking-wider font-bold text-blue-500 mb-2">Puntos Totales</div>
                    <div class="text-3xl font-black text-gray-100" x-text="user?.total_score"></div>
                </div>
                <div class="bg-green-900/20 border border-green-500/20 p-5 rounded-2xl text-center">
                    <div class="text-xs uppercase tracking-wider font-bold text-green-500 mb-2">Plenos (Strikes)</div>
                    <div class="text-3xl font-black text-gray-100" x-text="user?.total_strikes"></div>
                </div>
                <div class="bg-yellow-900/20 border border-yellow-500/20 p-5 rounded-2xl text-center">
                    <div class="text-xs uppercase tracking-wider font-bold text-yellow-500 mb-2">Semiplenos (Spares)</div>
                    <div class="text-3xl font-black text-gray-100" x-text="user?.total_spares"></div>
                </div>
            </div>

            <div>
                <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-4">Mis Motes</h3>
                <div class="flex flex-wrap gap-2" x-show="user?.nicknames?.length > 0">
                    <template x-for="nick in user?.nicknames">
                        <span class="px-4 py-1.5 bg-gray-800 border border-gray-700 rounded-full text-sm font-medium text-gray-200" x-text="nick"></span>
                    </template>
                </div>
                <div x-show="!user?.nicknames?.length" class="p-4 rounded-xl border border-dashed border-gray-700 text-gray-500 italic text-center text-sm">
                    Aún no tienes motes. ¡Juega unas partidas!
                </div>
            </div>
        </div>
    </div>

    <!-- Datos personales -->
    <div x-show="!loading && user" class="bg-surface rounded-3xl border border-gray-800 shadow-xl p-6" x-cloak>
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider">Datos personales</h3>
            <button x-show="!editing" @click="startEdit()"
                class="text-sm font-semibold text-primary hover:text-purple-300 px-3 py-1.5 rounded-full border border-purple-500/30 bg-purple-600/10">
                Editar
            </button>
        </div>

        <div x-show="saved" x-transition class="mb-4 bg-green-900/30 border border-green-500/30 text-green-300 px-4 py-3 rounded-xl text-sm" x-text="saved"></div>

        <!-- Vista -->
        <dl x-show="!editing" class="divide-y divide-gray-800 text-sm">
            <template x-for="f in fields" :key="f.key">
                <div class="py-3 flex justify-between gap-4">
                    <dt class="text-gray-500 shrink-0" x-text="f.label"></dt>
                    <dd class="text-gray-100 font-medium text-right truncate" x-text="(f.prefix || '') + (user?.[f.key] || '—')"></dd>
                </div>
            </template>
        </dl>

        <!-- Edición -->
        <form x-show="editing" @submit.prevent="save()" class="space-y-4">
            <div x-show="error" class="bg-red-900/30 border border-red-500/30 text-red-300 px-4 py-3 rounded-xl text-sm" x-text="error"></div>
            <template x-for="f in fields" :key="f.key">
                <label class="block">
                    <span class="block text-xs font-semibold text-gray-400 mb-1" x-text="f.label"></span>
                    <input x-model="form[f.key]" :type="f.type" :required="f.required" :autocomplete="f.autocomplete"
                        class="w-full p-3 bg-background rounded-xl border border-gray-700 text-gray-100 text-base outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                    <span x-show="f.hint" class="block text-[11px] text-gray-500 mt-1" x-text="f.hint"></span>
                </label>
            </template>
            <label x-show="emailChanged()" class="block" x-transition>
                <span class="block text-xs font-semibold text-gray-400 mb-1">Contraseña actual (para cambiar el correo)</span>
                <input x-model="form.current_password" type="password" autocomplete="current-password"
                    class="w-full p-3 bg-background rounded-xl border border-gray-700 text-gray-100 text-base outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </label>
            <div class="flex gap-3 pt-1">
                <button type="button" @click="editing = false" class="flex-1 py-3 rounded-full border border-gray-700 text-gray-300 font-semibold">Cancelar</button>
                <button type="submit" :disabled="saving"
                    class="flex-1 py-3 rounded-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold disabled:opacity-50">
                    <span x-text="saving ? 'Guardando...' : 'Guardar'"></span>
                </button>
            </div>
        </form>
    </div>

    <!-- Contraseña -->
    <div x-show="!loading && user" class="bg-surface rounded-3xl border border-gray-800 shadow-xl p-6" x-cloak>
        <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-2">Contraseña</h3>
        <p class="text-sm text-gray-400 mb-4">Te enviaremos a tu correo un enlace para elegir una contraseña nueva.</p>
        <div x-show="resetMsg" class="mb-4 px-4 py-3 rounded-xl text-sm border"
            :class="resetOk ? 'bg-green-900/30 border-green-500/30 text-green-300' : 'bg-red-900/30 border-red-500/30 text-red-300'"
            x-text="resetMsg"></div>
        <button @click="requestPasswordReset()" :disabled="resetSending || resetOk"
            class="w-full py-3 rounded-full border border-purple-500/40 text-primary font-semibold bg-purple-600/10 disabled:opacity-50">
            <span x-text="resetSending ? 'Enviando...' : (resetOk ? 'Enlace enviado' : 'Cambiar contraseña')"></span>
        </button>
    </div>
</div>

<script>
function profileData() {
    return {
        loading: true,
        user: null,
        editing: false,
        saving: false,
        error: '',
        saved: '',
        form: {},
        resetSending: false,
        resetOk: false,
        resetMsg: '',
        fields: [
            { key: 'full_name', label: 'Nombre', type: 'text', required: true, autocomplete: 'name' },
            { key: 'username', label: 'Usuario', type: 'text', required: true, autocomplete: 'username', prefix: '@',
              hint: 'Con este nombre te invitan a las salas. Letras, números, punto, guion o guion bajo.' },
            { key: 'email', label: 'Correo', type: 'email', required: true, autocomplete: 'email' },
            { key: 'phone_number', label: 'Teléfono', type: 'tel', required: false, autocomplete: 'tel' },
        ],
        errorText(data, fallback) {
            if (Array.isArray(data.detail)) return data.detail.map(d => String(d.msg).replace(/^Value error, /, '')).join('. ');
            return data.detail || fallback;
        },
        startEdit() {
            this.form = {
                full_name: this.user.full_name, username: this.user.username,
                email: this.user.email, phone_number: this.user.phone_number || '', current_password: ''
            };
            this.error = '';
            this.saved = '';
            this.editing = true;
        },
        emailChanged() {
            return this.editing && this.form.email && this.form.email.trim() !== this.user.email;
        },
        async save() {
            this.saving = true;
            this.error = '';
            const body = {
                full_name: this.form.full_name, username: this.form.username,
                phone_number: this.form.phone_number, email: this.form.email.trim()
            };
            if (this.emailChanged()) body.current_password = this.form.current_password;
            try {
                const res = await fetch('/api/users/me', {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${getAuthToken()}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (res.status === 401) logout();
                if (!res.ok) throw new Error(this.errorText(data, 'No se han podido guardar los cambios'));
                localStorage.setItem('token', data.access_token);
                Object.assign(this.user, {
                    full_name: data.full_name, username: data.username,
                    email: data.email, phone_number: data.phone_number
                });
                this.editing = false;
                this.saved = 'Cambios guardados';
                setTimeout(() => this.saved = '', 3000);
            } catch (e) {
                this.error = e.message;
            } finally {
                this.saving = false;
            }
        },
        async requestPasswordReset() {
            this.resetSending = true;
            this.resetMsg = '';
            try {
                const res = await fetch('/api/users/me/password-reset', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${getAuthToken()}` }
                });
                const data = await res.json();
                if (res.status === 401) logout();
                if (!res.ok) throw new Error(this.errorText(data, 'No se ha podido enviar el enlace'));
                this.resetOk = true;
                this.resetMsg = data.message;
            } catch (e) {
                this.resetMsg = e.message;
            } finally {
                this.resetSending = false;
            }
        },
        async init() {
            checkAuth();
            try {
                const res = await fetch('/api/users/me', {
                    headers: { 'Authorization': `Bearer ${getAuthToken()}` }
                });
                if (!res.ok) {
                    if(res.status === 401) logout();
                    throw new Error('Error cargando perfil');
                }
                this.user = await res.json();
            } catch (e) {
                console.error(e);
            } finally {
                this.loading = false;
            }
        }
    }
}
</script>
{% endblock %}
