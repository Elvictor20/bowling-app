<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolos Manager - Restablecer Contraseña</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 min-h-screen flex items-center justify-center p-4">
    
    <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-md w-full max-w-md" x-data="{
        token: new URLSearchParams(window.location.search).get('token'),
        new_password: '',
        confirm_password: '',
        error: '',
        success: '',
        loading: false,
        async submit() {
            if (!this.token) {
                this.error = 'No se encontró el token de recuperación.';
                return;
            }
            if (this.new_password !== this.confirm_password) {
                this.error = 'Las contraseñas no coinciden.';
                return;
            }

            this.loading = true;
            this.error = '';
            this.success = '';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: this.token, new_password: this.new_password })
                });
                
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Error al restablecer contraseña');
                
                this.success = 'Contraseña actualizada correctamente. Redirigiendo...';
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            } catch(e) {
                this.error = e.message;
            } finally {
                this.loading = false;
            }
        }
    }">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">Nueva Contraseña</h1>
            <p class="text-gray-500 text-sm">Elige una nueva contraseña para tu cuenta.</p>
        </div>

        <div x-show="!token" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded text-sm mb-4">
            El enlace de recuperación es inválido o falta el token.
        </div>

        <form @submit.prevent="submit" class="space-y-4" x-show="token">
            <div x-show="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded text-sm" x-text="error"></div>
            <div x-show="success" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded text-sm" x-text="success"></div>
            
            <div>
                <label class="block text-sm font-medium mb-1">Nueva Contraseña</label>
                <input x-model="new_password" type="password" required minlength="6" class="w-full p-3 rounded bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-1">Confirmar Nueva Contraseña</label>
                <input x-model="confirm_password" type="password" required minlength="6" class="w-full p-3 rounded bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <button type="submit" :disabled="loading || success" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition disabled:opacity-50">
                <span x-show="!loading">Actualizar contraseña</span>
                <span x-show="loading">Actualizando...</span>
            </button>
        </form>

        <p class="mt-4 text-center text-sm">
            <a href="/forgot-password" class="text-blue-500 hover:underline">Solicitar un nuevo enlace</a>
        </p>
    </div>

</body>
</html>
